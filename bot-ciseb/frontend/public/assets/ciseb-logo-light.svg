<svg viewBox="0 0 640 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo CISEB Oficial - Versão Clara">
  <defs>
    <filter id="cisebLogoGlow_light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#005BAC" flood-opacity="0.45" />
    </filter>
    <linearGradient id="cisebTextGrad_light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CCEFFF" />
    </linearGradient>
  </defs>

  <!-- Wordmark CISEB -->
  <g filter="url(#cisebLogoGlow_light)">
    <text x="315" y="114" text-anchor="middle" fill="url(#cisebTextGrad_light)" font-family="'Brigends Expanded', 'Brigends', 'Syne', 'Orbitron', 'Montserrat', sans-serif" font-size="106" font-weight="900" letter-spacing="6">CISEB</text>
  </g>

  <!-- Divisor e Estrela Central -->
  <g transform="translate(0, 138)">
    <line x1="60" y1="0" x2="295" y2="0" stroke="rgba(0, 170, 255, 0.6)" stroke-width="1.8" stroke-linecap="round" />
    <polygon points="315,-7 317.5,-1.5 323.5,-1.5 318.5,2 320.5,7.5 315,4 309.5,7.5 311.5,2 306.5,-1.5 312.5,-1.5" fill="#005BAC" stroke="#00AAFF" stroke-width="0.75" />
    <line x1="335" y1="0" x2="570" y2="0" stroke="rgba(0, 170, 255, 0.6)" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Subtítulos Institucionais -->
  <text x="315" y="168" text-anchor="middle" fill="#E0F2FE" font-family="'Arial', 'Helvetica', sans-serif" font-size="22.5" font-weight="700" letter-spacing="2.8">CENTRO DE INOVAÇÃO E SUSTENTABILIDADE</text>
  <text x="315" y="196" text-anchor="middle" fill="#E0F2FE" font-family="'Arial', 'Helvetica', sans-serif" font-size="22.5" font-weight="700" letter-spacing="4.2">DA EDUCAÇÃO BÁSICA</text>
</svg>
